[package]
name = "huginn-evm-relayer"
description = "Makes Huginn proofs for EVM chains, using huginn as a library."
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
# Huginn itself. Local checkout next to this repo; for a clone of the GitHub repo use
#   huginn-prover = { git = "https://github.com/AlphaR2/huginn" }
huginn-prover = { path = "../../huginn/zk/prover" }
tokio = { version = "1", features = ["full"] }
clap = { version = "4", features = ["derive"] }
serde_json = "1"
anyhow = "1"

# Required by huginn: the SP1-accelerated curve code it was proven equal to Agave with.
[patch.crates-io]
bls12_381 = { git = "https://github.com/sp1-patches/bls12_381", tag = "patch-0.8.0-sp1-6.10.0" }
