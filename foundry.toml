[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]
solc_version = "0.8.28"
optimizer = true
optimizer_runs = 200
# Tests read test/fixtures; scripts read the proof the relayer writes to proofs/.
fs_permissions = [{ access = "read", path = "./test/fixtures" }, { access = "read", path = "./proofs" }]

[lint]
# SolanaTx is a parser: reverting inside its loops on malformed input is the point.
exclude_lints = ["require-revert-in-loop"]
