[package]
name = "huginn-evm"
description = "Huginn for EVM chains: a TUI that runs the whole Solana -> proof -> EVM flow step by step, the same steps as subcommands, and proof making on top of huginn-prover."
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
# Huginn itself. Local checkout next to this repo; for a clone of the GitHub repo use
#   huginn-prover = { git = "https://github.com/AlphaR2/huginn" }
huginn-prover = { path = "../../huginn/zk/prover" }
tokio = { version = "1", features = ["full"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
anyhow = "1"
dotenvy = "0.15"
ratatui = "0.30"

# Required by huginn: the SP1-accelerated curve code it was proven equal to Agave with.
[patch.crates-io]
bls12_381 = { git = "https://github.com/sp1-patches/bls12_381", tag = "patch-0.8.0-sp1-6.10.0" }
