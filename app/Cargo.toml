[package]
name = "huginn-evm"
description = "Huginn for EVM chains: a TUI that runs the whole Solana -> proof -> EVM flow step by step, the same steps as subcommands, and proof making on top of huginn-prover."
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
# Huginn itself. Local checkout next to this repo; for a clone of the GitHub repo use
#   huginn-prover = { git = "https://github.com/AlphaR2/huginn" }
huginn-prover = { path = "../../huginn/zk/prover" }
tokio = { version = "1", features = ["full"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
bs58 = "0.5"
anyhow = "1"
dotenvy = "0.15"
ratatui = "0.30"
# Shared with the huginn binaries: RPC URLs can carry API keys, so only the host is shown.
redact = { path = "../../huginn/crates/redact" }
# In-process JSON-RPC (a `curl` child process would put the URL on the command line).
ureq = { version = "2", features = ["json"] }

[features]
# Prove on Succinct's prover network: build with `--features network`, then run with
# `SP1_PROVER=network` and `NETWORK_PRIVATE_KEY` exported in the shell (never in .env).
network = ["huginn-prover/network"]

# Required by huginn: the SP1-accelerated curve code it was proven equal to Agave with.
[patch.crates-io]
bls12_381 = { git = "https://github.com/sp1-patches/bls12_381", tag = "patch-0.8.0-sp1-6.10.0" }
